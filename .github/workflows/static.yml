# Workflow para desplegar el CV en GitHub Pages
name: Deploy CV to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Inject EmailJS config
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          CI: 'true'
        run: node build.js

      - name: Guard - warn if secrets not injected
        run: |
          if grep -rE '__EMAILJS_(PUBLIC_KEY|SERVICE_ID|TEMPLATE_ID)__' index.html js/modules/form.js; then
            echo "::warning::EmailJS placeholders still present. Configure secrets in Settings → Secrets and variables → Actions to enable the contact form."
          else
            echo "✅ All EmailJS placeholders replaced."
          fi

      - name: Remove dev-only files before upload
        run: |
          rm -rf .git .github .idea .claude node_modules no_subir \
            AGENTS.md MEMORIA.md .gitignore .DS_Store \
            run-all.ps1 run-all.bat run.ps1 run.bat \
            convert-webp.js convert-webp2.js build.js package.json
          find . -name "*.zip" -delete
          find . -iname "files(1)*" -exec rm -rf {} +
          find . -iname "Captura*" -delete

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
